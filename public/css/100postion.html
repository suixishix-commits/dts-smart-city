<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>分辨率</title>
  </head>
  <style>
    * {
      margin: 0;
      padding: 0;
    }
    body,
    html {
      width: 100vw;
      height: 100vh;
    }
    .box {
      position: relative;
      width: 60%;
      height: 60%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(176, 172, 171, 0.834);
    }

    .text {
      position: absolute;
      width: 50%;
      height: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background-color: antiquewhite;
      color: #fff;
      font-size: 32px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .text span {
      /**重点：文字过大时，要偏移*/
      transform: translateY(-6%);
    }
  </style>
  <body>
    <div class="box">
      <div class="text"><img src="assets/1.png" /><span>播放</span></div>
    </div>
  </body>
</html>
<script></script>
