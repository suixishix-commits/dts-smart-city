      if (i >= arrActorId.length) {
        isLoaded = false
        i = 0
        FdExternal.postEvent('AssemblingFinished')
        fdapi.showTickWindow(false)
        fdapi.removeTick()
      } else {
        fdapi.tileLayer.showActor(sanJiangLayerId, arrActorId[i])
      }
      i++
    } else {
      document.getElementById('r1').innerText = `[Frame:${frame}] ` + i + '---' + arrActorId.length + '---' + sanJiangLayerId + ' ' + fdapi?.isReady
    }
