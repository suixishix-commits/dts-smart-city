<script>
  // DTS方法调用参考
  // fdapi.tag.delete(id)
  // FdExternal.postEvent('test string')

  /**
   * 实现思路
   * 1、通过actor转co去控制闸移动
   * 2、添加随机出水口,制造碰撞回旋
   * 3、添加水闸固定粒子和随机粒子
   *
   * */

  /**----以下是初始化配置信息----*/
  // 闸对象图层ID
  let sluiceLayerId = 'sluiceLayerId'
  // 旋转水闸ActorID
  let arrSluiceId = []
  // 流体类型
  let fluidType = 16
  // 流体BBox
  let fluidBox = [492442.474375, 2491871.84, -0.887, 492885.60875, 2492110.72, 6]
  // 随机出水口范围
  let sourcesRandomBox = [492604.74875, 2491933.92, -0.6, 492743.38375, 2491955.68, 6]
  // 随机水粒子范围
  let particlesRandomBox = [492672.8, 2491946, 2, 492700, 2491957, 3]
  // 固定出水口对象
  let arrWaterSources = [
    {
      id: 'fs_1',
      rotation: [0, 0, 0],
      bbox: [492647.4529882475, 2491936.1314782146, 0.684841046358344, 492649.4529882475, 2491937.1314782146, 1.1848410463583439],
      velocity: [0, 2],
      shape: 0,
      duration: -1
    },
    {
      id: 'fs_2',
      rotation: [0, 0, 0],
      bbox: [492736.51334172784, 2491942.668292436, -0.03109014871246385, 492738.51334172784, 2491943.668292436, 0.46890985128753615],
      velocity: [0, 2],
      shape: 0,
      duration: -1
    },
    {
      id: 'fs_3',
      rotation: [0, 0, 0],
      bbox: [492702.71280551114, 2491954.523382256, 0.9818756939685739, 492704.71280551114, 2491955.523382256, 1.4818756939685738],
      velocity: [0, 2],
      shape: 0,
      duration: -1
    },
    {
      id: 'fs_4',
      rotation: [0, 0, 0],
      bbox: [492639.3552765224, 2491950.2622777675, -0.16685619723626155, 492641.3552765224, 2491951.2622777675, 0.33314380276373845],
      velocity: [0, 2],
      shape: 0,
      duration: -1
    },
    {
      id: 'fs_5',
      rotation: [0, 0, 0],
      bbox: [492721.53047376685, 2491954.912146831, -0.32621512194233204, 492723.53047376685, 2491955.912146831, 0.17378487805766796],
      velocity: [0, 2],
      shape: 0,
      duration: -1
    },
    {
      id: 'fs_6',
      rotation: [0, 0, 0],
      bbox: [492737.57584920677, 2491934.7486173813, 0.6381587945943018, 492739.57584920677, 2491935.7486173813, 1.1381587945943017],
      velocity: [0, 2],
      shape: 0,
      duration: -1
    }
  ]
  // 调用次数
  let i = 0
  // 帧调用次数
  let count = 0
  // 是否加载完毕
  let isLoaded = false

  window.onload = function () {
    new DigitalTwinAPI()
    isLoaded = true
    if (fdapi?.isReady) {
      initFluid()
    }
  }

  // 供客户端调用
  // let code = "clientCalled('this is a message called from client.')";
  // fdapi.executeJsInTickPage(code);
  function clientCalled() {
    // 清空定时器
    arrTimerId.forEach((id) => {
      clearInterval(id)
    })
  }

  // Dts调用主入口
  function tick(frame) {
    i++
    if (isLoaded && fdapi && fdapi.isReady && i % 2 == 0) {
    } else {
      document.getElementById('r1').innerText = `[Frame:${frame}] ---${z} ` + fdapi?.isReady
    }
  }

  // 日志输出
  function printLog(info, consoleData = undefined, isAdd = true) {
    console.log(info, consoleData)
    let origin = document.getElementById('r1').innerHTML
    if (isAdd) {
      document.getElementById('r1').innerHTML = origin + '<br>' + new Date().toLocaleString('zh-CN') + '  ' + info
    } else {
      document.getElementById('r1').innerHTML = new Date().toLocaleString('zh-CN') + '  ' + info
    }
  }

  /**
   * 初始化水闸
   * */
  async function initSluice() {
    // 隐藏水闸
    // fdapi.tileLayer.hideActors([{ id: sluiceLayerId, objectIds: arrSluiceId }])

    // actor转Co配置信息
    let actorConfigArr = []
    arrSluiceId.forEach((item, index) => {
      actorConfigArr.push({
        id: item,
        tileLayerId: sluiceLayerId, // 层id
        objectId: item, // 数组
        coordinateType: 0, // 坐标系类型
        smoothMotion: 1, //1: 平滑移动，0: 跳跃移动
        scale: [1, 1, 1], //模型缩放
        groupId: 'co_sluice'
      })
    })

    // 清空
    await fdapi.customObject.clear()
    // Actor转CO
    fdapi.customObject.addByTileLayer(actorConfigArr)
    // 旋转
    fdapi.customObject.updateBegin()
    arrSluiceId.forEach((item, index) => {
      fdapi.customObject.setLocalRotation(item, [-45, 90, 0])
    })
    fdapi.customObject.updateEnd()

    //
  }

  // 定时器
  let arrTimerId = []
  // 随机粒子定时器
  let randomTimerId = undefined

  /**
   * 初始化流体
   * */
  async function initFluid() {
    //  显示水闸孔粒子
    showFixedParticles()
    fdapi.fluid.delete(['ff', 'ff_random'])

    // 流体对象
    let fluid = {
      id: 'ff',
      bbox: fluidBox,
      style: fluidType, //0-27，黄色[12、13,16,18,24]
      // color: [0.902, 0.635, 0.235, 1.0],
      sources: arrWaterSources
    }

    // 激活水闸出水口
    let activeSources = []
    for (let index = 0; index < arrWaterSources.length; index++) {
      activeSources.push({
        id: arrWaterSources[index].id,
        active: true
      })
    }
    printLog('添加fluid', fluid)
    fdapi.fluid.add(fluid)
    setTimeout(() => {
      let data = [
        {
          id: 'ff',
          sources: activeSources
        }
      ]
      fdapi.fluid.continueSource(data)
    }, 1000)

    // 延迟激活随机出水口,制造碰撞
    let count = 0
    setTimeout(async () => {
      randomFluid(true)
      let timerId = setInterval(async () => {
        randomFluid(false)
        count++
        if (count > 2) {
          clearInterval(timerId)
        }
      }, 20000)
      printLog(`随机出水口定时器ID：${timerId}`)
      arrTimerId.push(timerId)
    }, 10000)

    // 随机粒子
    setTimeout(() => {
      // showRandowParticles()
    }, 10000)

    // 结尾占位
  }

  /**
   * 随机出水口
   * */
  async function randomFluid(isAdd = true) {
    // 流体大BBOX范围
    let bbox = fluidBox

    fdapi.fluid.delete('ff_random')
    // 随机出水口
    let arrRandomWaterSources = []
    // 随机出水口激活数组
    let activeRandomSources = []
    // 随机Id
    let arrRandomWaterSourcesId = []
    // 随机出水口范围
    let randomBox = sourcesRandomBox
    // 随机坐标点
    let arrRandomLocation = []

    for (let index = 0; index < 6; index++) {
      let lbPoint = [
        randomBox[0] + Math.random() * (randomBox[3] - randomBox[0]),
        randomBox[1] + Math.random() * (randomBox[4] - randomBox[1]),
        randomBox[2] + Math.random() * 2
      ]
      arrRandomLocation.push(lbPoint)

      let id = `fs_R_${index + 1}`
      arrRandomWaterSources.push({
        id: id,
        rotation: [0, 0, 0],
        bbox: [lbPoint[0], lbPoint[1], lbPoint[2], lbPoint[0] + 2, lbPoint[1] + 1, lbPoint[2] + 0.5],
        velocity: [0, 2],
        shape: 1,
        duration: -1
      })
      activeRandomSources.push({
        id: id,
        active: true
      })
      arrRandomWaterSourcesId.push(id)
    }

    // 流体对象
    let fluid = {
      id: 'ff_random',
      bbox: bbox,
      style: fluidType, //0-27，黄色[12、13,16,18,24]
      // color: [0.902, 0.635, 0.235, 1.0],
      sources: arrRandomWaterSources
    }

    await fdapi.fluid.add(fluid)

    let data = [
      {
        id: 'ff_random',
        sources: activeRandomSources
      }
    ]
    fdapi.fluid.continueSource(data)
    // console.log('添加随机出水口', fluid, data,arrRandomLocation)
    printLog(`添加随机出水口`, fluid)

    // 随机出水点水粒子
    showFluidWaterParticles(arrRandomLocation, isAdd)
  }

  /**
   * 显示水粒子
   * */
  async function showFluidWaterParticles(arrRandomLocation, isAdd = true) {
    console.log('随机坐标：', arrRandomLocation)
    if (arrRandomLocation?.length > 0) {
      // z偏移 喷水_2：10，水花_3：0
      // let type = '喷水_2'
      // let localRotation=[60, 0, 0]
      // let zOffset = 10
      let type = '水花_3'
      let localRotation = [120, 0, 0]
      let zOffset = 0
      if (isAdd) {
        // 偏移坐标
        let arrLocation = arrRandomLocation.map((item) => {
          return [item[0] + 2.5, item[1] + 2.5, item[2] - zOffset]
        })
        // let config = [{ type: '喷水_2', localRotation: [60, 0, 0], locations: arrLocation, idPrex: 'fluid' }]
        let config = [{ type: type, localRotation: [120, 0, 0], locations: arrLocation, idPrex: 'fluid' }]
        showParticles(config, 'co_FluidWaterParticles', false)
      } else {
        let arrBP = []
        fdapi.customObject.updateBegin()
        arrRandomLocation.forEach((item, index) => {
          let id = 'fluid_particles_' + type + '_' + index
          fdapi.customObject.setLocation(id, [item[0] + 2.5, item[1] + 2.5, item[2] - zOffset])
          //喷水_2 粒子数量 30 + Math.random() * 40
          //水花_3 粒子数量 Math.random()
          arrBP.push({
            id: id,
            functionName: '粒子数量',
            parameters: [{ paramType: 3, paramValue: Math.random() }]
          })
        })
        fdapi.customObject.updateEnd()
        fdapi.customObject.callBPFunction(arrBP)
      }
    }
  }

  /**
   * 显示水粒子
   * @param {*} config [{type,localRotation,locations,idPrex}]
   * @param {*} groupId
   * @param {*} hideFirstShow 是否隐藏首次显示，采用定时器延迟加载
   * */
  async function showParticles(config, groupId = 'co_WaterParticles', hideFirstShow = false) {
    if (config?.length > 0) {
      // 删除之前
      await fdapi.infoTree.deleteByGroupId(groupId)
      // 资源包路径
      let arrRes = {
        喷水_2: '/JC_CustomAssets/ParticleLibrary/Exhibition/水/喷水_2',
        喷水_4: '/JC_CustomAssets/ParticleLibrary/Exhibition/水/喷水_4',
        Water_3: '/JC_CustomAssets/ParticleLibrary/Exhibition/水流/Water_3',
        水花_1: '/JC_CustomAssets/ParticleLibrary/Exhibition/水/水花_1',
        水花_2: '/JC_CustomAssets/ParticleLibrary/Exhibition/水/水花_2',
        水花_3: '/JC_CustomAssets/ParticleLibrary/Exhibition/水/水花_3'
      }
      // 粒子Co数组
      let arrCo = []
      // 蓝图
      let arrBP = []

      config.forEach((item) => {
        for (let index = 0; index < item.locations.length; index++) {
          if (arrRes[item.type]) {
            // 模型旋转
            let location = [...item.locations[index]]
            // 如果首次不显示，则z轴偏移-100隐藏
            if (hideFirstShow) {
              location[2] = -100
            }
            let idPrex = item?.idPrex ? item.idPrex : 'default'
            let id = idPrex + '_particles_' + item.type + '_' + index

            // 蓝图函数
            let bpFun = getBPFunConfig(item.type, id)
            if (bpFun) {
              arrBP.push(bpFun)
            }
            arrCo.push({
              id: id, //自定义对象唯一id
              assetPath: arrRes[item.type], //资源目录，自定义对象在pak文件资源包里的相对路径
              groupId: groupId,
              location: location, //位置坐标
              coordinateType: 0, // 坐标系类型
              rotation: [0, 0, 0], // 世界坐标系旋转
              localRotation: item.localRotation, //模型自身旋转
              scale: [1, 1, 1], //模型缩放
              isEffectRotation: true, //是否开启旋转效果
              smoothMotion: 0, //1: 平滑移动，0: 跳跃移动
              supportAttach: true, //不支持贴画贴合
              visible: true, //模型加载后默认是否显示
              userData: JSON.stringify(item.locations[index])
            })
          }
        }
      })

      console.log(`${groupId}粒子对象：`, arrCo)
      await fdapi.customObject.add(arrCo)
      if (arrBP.length > 0) {
        fdapi.customObject.callBPFunction(arrBP)
      }
      if (hideFirstShow) {
        // 延迟还原位置
        setTimeout(() => {
          fdapi.customObject.updateBegin()
          arrCo.forEach((item, index) => {
            fdapi.customObject.setLocation(item.id, JSON.parse(item.userData))
          })
          fdapi.customObject.updateEnd()
        }, 1500)
      }
    }
  }

  /**
   * 显示水闸固定水粒子
   * */
  async function showFixedParticles() {
    let config = [
      {
        type: '水花_3',
        localRotation: [80, 0, 0],
        locations: []
      }
    ]

    arrWaterSources.forEach((item) => {
      config[0].locations.push([(item.bbox[0] + item.bbox[3]) / 2, (item.bbox[1] + item.bbox[4]) / 2, (item.bbox[2] + item.bbox[5]) / 2])
    })

    showParticles(config, 'co_Fixed_WaterParticles', false)
  }

  /**
   * 随机显示水粒子
   * @param {*} config [{type,num}]
   * */
  async function showRandowParticles(z = 38) {
    let config = [
      { type: '喷水_2', num: 50 + Math.floor(Math.random() * 20), localRotation: [60, 0, 0], zOffset: -20, hideFirstShow: true },
      { type: '水花_3', num: 10 + Math.floor(Math.random() * 20), localRotation: [120, 0, 0], zOffset: 0, hideFirstShow: false }
    ]
    if (config?.length > 0) {
      // 随机孔范围
      let randomBox = particlesRandomBox
      // 随机配置
      let arrConfig = []
      let arrHideFirstShowConfig = []
      let arrAllConfig = []

      config.forEach((item) => {
        let locations = []
        for (let index = 0; index < item.num; index++) {
          let point = [
            randomBox[0] + Math.random() * (randomBox[3] - randomBox[0]),
            randomBox[1] + Math.random() * (randomBox[4] - randomBox[1]),
            randomBox[2] + Math.random() * (randomBox[5] - randomBox[2])
          ]
          locations.push(point)
        }
        if (item.hideFirstShow) {
          arrHideFirstShowConfig.push({
            type: item.type,
            locations: locations,
            localRotation: item.localRotation
          })
        } else {
          arrConfig.push({
            type: item.type,
            locations: locations,
            localRotation: item.localRotation
          })
        }
      })
      if (arrConfig?.length > 0) {
        await showParticles(arrConfig, 'co_Random_WaterParticles', false)
      }
      if (arrHideFirstShowConfig?.length > 0) {
        await showParticles(arrHideFirstShowConfig, 'co_Random_WaterParticles_hideFirstShow', true)
      }

      arrAllConfig = arrConfig.concat(arrHideFirstShowConfig)

      // 定时更新位置 水花_3
      let count2 = 0
      let timerId = setInterval(() => {
        console.log(`定时器ID:`, timerId, randomTimerId)
        let elevation = 38 + count2 * 0.2
        updateRandowParticles(arrConfig, randomBox, elevation)
        count2++
        if (count2 > 30) {
          clearInterval(timerId)
        }
      }, 10000)
      arrTimerId.push(timerId)

      // 定时更新位置 喷水_2
      let count3 = 0
      let timerId2 = setInterval(() => {
        console.log(`定时器ID:`, arrTimerId)
        let elevation = 38 + count2 * 0.4
        updateRandowParticles(arrHideFirstShowConfig, randomBox, elevation)
        count2++
        if (count2 > 15) {
          clearInterval(timerId2)
        }
      }, 20000)
      arrTimerId.push(timerId2)
    }
  }

  /**
   *  获取BP函数配置
   *  @param {string} type 资源类型
   *  @param {string} id coId
   * */
  function getBPFunConfig(type, id) {
    let result = undefined
    // 蓝图函数
    switch (type) {
      case '喷水_2':
        result = {
          id: id,
          functionName: '粒子数量',
          parameters: [{ paramType: 3, paramValue: 30 + Math.random() * 40 }]
        }
        break
      case '水花_3':
        result = {
          id: id,
          functionName: '粒子数量',
          parameters: [{ paramType: 3, paramValue: 0.2 + Math.random() * 0.3 }]
        }
        break
      default:
        break
    }
    return result
  }

  /**
   * 更新随机生成粒子
   */
  function updateRandowParticles(config, randomBox, z) {
    if (config?.length > 0) {
      // 待执行蓝图
      let arrBP = []
      fdapi.customObject.updateBegin()
      config.forEach((item) => {
        for (let index = 0; index < item.locations.length; index++) {
          if (item.type) {
            let idPrex = item?.idPrex ? item.idPrex : 'default'
            let id = idPrex + '_particles_' + item.type + '_' + index
            let point = [
              randomBox[0] + Math.random() * (randomBox[3] - randomBox[0]),
              randomBox[1] + Math.random() * (randomBox[4] - randomBox[1]),
              randomBox[2] + Math.random() * (randomBox[5] - randomBox[2])
            ]
            // 蓝图函数
            let bpFun = getBPFunConfig(item.type, id)
            if (bpFun) {
              arrBP.push(bpFun)
            }
            // 修改位置
            fdapi.customObject.setLocation(id, point)
          }
        }
      })
      fdapi.customObject.updateEnd()
      if (arrBP.length > 0) {
        fdapi.customObject.callBPFunction(arrBP)
      }
    }
  }

  // 结尾占位
</script>
