<script>
  // 默认速度,0千米/小时
  let speed = 0;
  // 运行决策运动场景图层ID
  // 运动场景3
  let layer1Info = {
    layerId: "C8019D594834ABCBD281D48445946CBD",
    defautLocation: [259133, 4250683.65, 164.69],
    location: [259133, 4250683.65, 164.69],
  };

  // 运动场景2
  let layer2Info = {
    layerId: "8608C0B2412BCAA06B98858D116E1293",
    defautLocation: [263133, 4250683.65, 164.69],
    location: [263103, 4250683.65, 164.69],
  };

  // DTS方法调用参考
  // fdapi.tag.delete(id)
  // FdExternal.postEvent('test string')
  // fdapi.showTickWindow(false);
  // 调用次数
  let i = 0;
  // 帧调用次数
  let count = 0;
  // 是否加载完毕
  let isLoaded = false;
  // 状态.stop\run\reset
  let status = "stop";

  window.onload = function () {
    new DigitalTwinAPI();
    isLoaded = true;
    let temp = getURLParameter("speed");
    if (temp >= 0) {
      speed = Number(((temp * 1000) / 3600).toFixed(2));
      status = "run";
    }
    let result = {
      type: "3dt-moving onload",
      distance: layer1Info.location[0] - layer2Info.location[0],
    };
    FdExternal.postEvent(JSON.stringify(result));
    //reset();
    //document.getElementById("r1").innerText = `初始速度${speed}`;
    // setInterval(() => {
    //   tick();
    // }, 500);
  };

  // 供客户端调用
  // let code = "setSpeed(30)";
  // fdapi.executeJsInTickPage(code);
  // 设置速度
  function setSpeed(num) {
    if (num > 0) {
      speed = Number(((num * 1000) / 3600).toFixed(2));
      document.getElementById("r1").innerText = `设置了速度${num}`;
      status = "run";
    } else {
      speed = 0;
      status = "stop";
    }
    let result = {
      type: "3dt-moving setSpeed",
      distance: layer1Info.location[0] - layer2Info.location[0],
    };
    FdExternal.postEvent(JSON.stringify(result));
  }

  // 重置图层位置
  function reset() {
    status == "reset";
    document.getElementById("r1").innerText = `设置了重置状态`;
    __g.tileLayer.setLocation(layer1Info.layerId, layer1Info.defautLocation);
    __g.tileLayer.setLocation(layer2Info.layerId, layer2Info.defautLocation);
    let result = {
      type: "3dt-moving tick reset",
      distance: layer1Info.location[0] - layer2Info.location[0],
    };
    FdExternal.postEvent(JSON.stringify(result));
  }

  // Dts调用主入口
  function tick(frame) {
    i++;
    //isLoaded && fdapi && fdapi.isReady && i % 3 == 0
    if (isLoaded && fdapi && fdapi.isReady && i % 3 == 0) {
      if (speed > 0) {
        layer1Info.location[0] -= speed;
        layer2Info.location[0] -= speed;

        // 场景3
        if (layer1Info.location[0] <= 256033) {
          layer1Info.location[0] = layer2Info.location[0] + 4000;
          // 从下方穿过
          layer1Info.location[2] = 120;
          //console.log(`场景1重置啦`);
        } else {
          layer1Info.location[2] = 164.69;
        }

        // 场景4
        if (layer2Info.location[0] <= 256033) {
          layer2Info.location[0] = layer1Info.location[0] + 4000 - speed;
          // 从下方穿过
          layer2Info.location[2] = 120;
          //console.log(`场景2重置啦`);
        } else {
          layer2Info.location[2] = 164.69;
        }

        //console.log(`${layer1Info.location[0]}-----${layer2Info.location[0]}`);
        __g.tileLayer.setLocation(layer1Info.layerId, layer1Info.location);
        //__g.tileLayer.setLocation(layer1ZB.layerId, layer1ZB.location);
        __g.tileLayer.setLocation(layer2Info.layerId, layer2Info.location);
        //__g.tileLayer.setLocation(layer2ZB.layerId, layer2ZB.location);
      }
    }
  }

  function getURLParameter(name) {
    return (
      decodeURIComponent(
        (new RegExp("[?|&]" + name + "=" + "([^&;]+?)(&|#|;|$)").exec(
          location.search
        ) || [, ""])[1].replace(/\+/g, "%20")
      ) || null
    );
  }
</script>
