  function processingData() {
    // fetch('').then(res => console.log(res)).catch(err => {
    //   console.log(err)
    // })

    // 过滤部分数据
    const listData = chartList.filter((item) => {
      let date_object = new Date(item.time)
      let hour = date_object.getHours()
      let minute = date_object.getMinutes()
      return hour === 8 && minute === 0
    })

    let arr = 1
    //x轴
    const xDataArr = listData
      .map((item) => {
        let formatted_date = arr += 1
        // let date_object = new Date(item.time)
        // let year = date_object.getFullYear()
        // let month = date_object.getMonth() + 1
        // let day = date_object.getDate()
        // let formatted_date = year + '-' + month.toString().padStart(2, '0') + '-' + day.toString().padStart(2, '0')
        return formatted_date
      })
      .slice(0, 16)

    //y
    const yDataArr = listData.map((item) => item.waterLevel)
    const wrz = listData.map((item) => item.wrz)
    const grz = listData.map((item) => item.grz)

    //y流量
    const yDataArrLiu = listData.map((item) => item.q)
    initChart(xDataArr, grz, wrz, yDataArr, yDataArrLiu)
  }

  function initChart(xDataArr, grz, wrz, yDataArr, yDataArrLiu) {
    // 基于准备好的dom，初始化echarts实例
    var myChart = echarts.init(document.getElementById('mind'));

    // 指定图表的配置项和数据
    const option = {
      animationDuration: 1500,
      // animationDelay: 500,
      animationEasing: 'cubicOut',
      axisLabel: {
        fontSize: 10,
        fontFamily: 'OPPOSans-R'
      },
      grid: {
        left: '20',
        right: '20',
        top: '20',
        bottom: '10',
        containLabel: true
      },
      legend: {
        width: '70%',
        textStyle: {
          color: '#fff',
          fontSize: 10,
          fontFamily: 'OPPOSans-R'
        },
        data: ['水位', '警戒水位', '保证水位', '流量'],
        orient: 'horizontal',
        // top: 20,
        itemHeight: 3,
        itemWidth: 15,
        left: 'center'
      },
      tooltip: {
        trigger: 'axis',
        show: true,
        axisPointer: {
          type: 'cross'
        },
        enterable: true,
        transitionDuration: 2,
        backgroundColor: 'rgba(0, 0, 0,0.2)',
        //borderColor:'#1658ac',
        textStyle: {
          color: '#fff',
          fontSize: 10,
          fontFamily: 'OPPOSans-R'
        },
        formatter: function (params) {
          let tooltipContent = ''
          for (let i = 0; i < params.length; i++) {
            const param = params[i]
            const xAxisName = param.axisValueLabel || ''
            const seriesName = param.seriesName || ''
            const dataValue = param.data || ''
            if (i === 0) {
              tooltipContent += '' + xAxisName + ' ' + '<br/>'
            }
            //tooltipContent += 'y轴:' + yAxisName + ' ' + yAxisUnit + '<br/>'
            tooltipContent += '' + seriesName + ''
            if (seriesName === '水位') {
              tooltipContent += ': ' + dataValue + 'm' + '<br/>'
            }
            if (seriesName === '流量' && dataValue != 'null') {
              tooltipContent += ': ' + dataValue + 'm³/s' + '<br/>'
            }
          }
          return tooltipContent
        }
      },
      xAxis: {
        data: xDataArr,
        type: 'category',
        axisTick: {
          show: false // 隐藏 x 轴刻度线
        },
        axisLabel: {
          color: '#fff',
          fontSize: 10,
          fontFamily: 'OPPOSans-R',
          interval: 3,
          align: 'center',
          padding: [0, 0, 0, 30],
          formatter: function (value) {
            return value + 's'
          }
        },
        axisLine: {
          lineStyle: {
            width: 2 // 设置x轴线条的宽度
          }
        }
      },
      yAxis: [{
          type: 'value',
          name: '水位 :m',
          axisLine: {
            show: true, // 隐藏 y 轴线
            lineStyle: {
              width: 2 // 设置轴线条的宽度
            }
          },
          axisTick: {
            show: false // 隐藏 y 轴刻度线
          },
          splitLine: {
            show: false
          },
          min: function (value) {
            const diff = (value.max - value.min) * 0.05
            return Math.floor(value.min - diff)
          },
          max: function (value) {
            const diff = (value.max - value.min) * 0.05
            return Math.ceil(value.max + diff)
          },
          nameLocation: 'end',
          nameTextStyle: {
            padding: [0, 0, 10, -20], // 可以根据需要调整
            color: '#fff'
          },
          axisLabel: {
            color: '#fff',
            fontSize: 10,
            fontFamily: 'OPPOSans-R'
          }
        },
        {
          type: 'value',
          name: '流量:m³/s',
          axisLine: {
            show: false // 隐藏 y 轴线
          },
          axisTick: {
            show: false // 隐藏 y 轴刻度线
          },
          splitLine: {
            show: false
          },
          min: function (value) {
            return (value.min * 0.9).toFixed(0)
          },
          max: function (value) {
            return (value.max * 1.1).toFixed(0)
          },
          //interval: 20,
          nameLocation: 'end',
          nameTextStyle: {
            padding: [0, 0, 10, 20], // 可以根据需要调整
            color: '#fff'
          },
          axisLabel: {
            color: '#fff',
            fontSize: 10,
            fontFamily: 'OPPOSans-R'
          }
        }
      ],
      series: [{
          name: '水位',
          type: 'line',
          data: yDataArr,
          smooth: true,
          symbol: 'none',
          itemStyle: {
            color: 'rgb(46, 222, 243)'
          },
          yAxisIndex: 0,
        },
        {
          name: '流量',
          type: 'line',
          data: yDataArrLiu,
          smooth: true,
          symbol: 'none',
          itemStyle: {
            color: '#5877fa'
          },
          yAxisIndex: 1
        }
      ]
    }

    // 使用刚指定的配置项和数据显示图表。
    myChart.setOption(option);

    // 定时跟新数据
    setInterval(() => {
      // 水位
      yDataArr.shift()
      let data = (Math.random() * (8 - 7)) + 7
      yDataArr.push(data.toFixed(3))
      // 流量
      yDataArrLiu.shift()
      let data2 = (Math.random() * (400 - 200)) + 200
      yDataArrLiu.push(data2.toFixed(3))
      // x轴
      xDataArr.shift()
      let data3 = xDataArr[xDataArr.length - 1] + 1
      xDataArr.push(data3)
      // 更新图表
      myChart.setOption({
        xAxis: {
          data: xDataArr
        },
        series: [
          {
            data: yDataArr
          },
          {
            data: yDataArrLiu
          }
      ]
      })
    }, 1000)
  }
