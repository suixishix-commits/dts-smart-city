<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>train_dialog</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        outline: none !important;
      }

      html,
      body {
        /*
        * 重点1：默认在1920*1080分辨率下,更改1rem=10px
        * 页面样式统一用rem为尺寸单位
        */
        font-size: 10px;
      }

      .box {
        width: 52rem;
        height: 53.6rem;
        background: url("./img/Subtract\ \(1\).png") no-repeat center center;
        background-size: 100% 100%;
        /*background-color: black;*/
      }
      .header {
        width: 52rem;
        height: 5.3rem;
        background: url("./img/减去顶层\ 40\ \(2\).png") no-repeat center center;
        background-size: 100% 100%;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .title {
        width: 16.8rem;
        height: 2.7rem;
        background: url("./img/列车基本信息.png") no-repeat center center;
        background-size: 100% 100%;
        margin: 0 0 0 1.5rem;
      }
      .close {
        width: 2rem;
        height: 2rem;
        background: url("./img/路径\ \(2\).png") no-repeat center center;
        background-size: 100% 100%;
        margin: 0 1.5rem 0 0;
        cursor: pointer;
      }
      .num {
        width: 50rem;
        height: 7.5rem;
        margin: 0 0 0 1.8rem;
        display: flex;
        align-items: center;
      }
      .warningNum {
        width: 18rem;
        height: 7.5rem;
        line-height: 7.5rem;
        font-family: Microsoft YaHei;
        font-size: 2.4rem;
        color: #fafbff;
      }
      .errorNum {
        width: 18rem;
        height: 7.5rem;
        line-height: 7.5rem;
        font-family: Microsoft YaHei;
        font-size: 2.4rem;
        color: #fafbff;
      }
      .errorNum_text {
        color: #ff5757;
      }
      .warningNum_text {
        color: #ffb231;
      }
      .context {
        display: flex;
        width: 48rem;
        height: 10rem;
        margin: 0 0 0 2rem;
        justify-content: space-between;
      }
      .context_left {
        width: 22rem;
        height: 10rem;
      }
      .context_right {
        width: 22rem;
        height: 10rem;
      }
      .context_bgi_top {
        width: 22rem;
        height: 2.8rem;
      }
      .context_bgi {
        width: 22rem;
        height: 2.8rem;
        background: url("./img/矩形\ 511\ \(1\).png") no-repeat;
        background-size: 100% 1.4rem;
        background-position: bottom;
        font-family: Microsoft YaHei;
        font-size: 2.4rem;
        font-weight: normal;
        line-height: 2.4rem;
        letter-spacing: 0em;

        color: #fafbff;
        padding: 0 0 0 0.5rem;
        border: 0.1rem solid transparent;
      }
      .text {
        font-family: YouSheBiaoTiHei;
        font-size: 3.2rem;
        font-weight: normal;
        line-height: 3.2rem;
        letter-spacing: 0em;
        color: #ffffff;
        text-shadow: 0.3rem 0.4rem 0.4rem rgba(0, 0, 0, 0.5);
        margin: 1rem 0 0 0;
        font-style: italic;
      }
      .danwei {
        display: inline-block;
        margin: 0 0 0 0.5rem;
        font-family: Microsoft YaHei;
        font-size: 2.2rem;
        font-weight: normal;
        line-height: 2.4rem;
        letter-spacing: 0em;
        font-style: none;
        color: rgba(250, 251, 255, 0.6);
      }
      .floor {
        width: 52rem;
        height: 10rem;
        display: flex;
        align-items: center;
        justify-content: space-evenly;
      }
      .warning {
        width: 16.6rem;
        height: 4.6rem;
        background-image: url("./img/btn_实时运行状态.png");
        background-size: 100% 100%;
        cursor: pointer;
      }
      .error {
        width: 18.8rem;
        height: 7.7rem;
        background-image: url("./img/btn_故障诊断.png");
        background-size: 100% 100%;
        cursor: pointer;
      }
      #speed {
        display: inline-block;
      }
      #weight {
        display: inline-block;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="header">
        <div class="title"></div>
        <div class="close" onclick="closeDialog()"></div>
      </div>
      <div class="num">
        <div class="errorNum">
          <span>故障数量：</span>
          <span id="faultNum" class="errorNum_text"></span>
        </div>
        <div class="warningNum">
          <span>预警数量：</span>
          <span id="warnNum" class="warningNum_text"></span>
        </div>
      </div>
      <div class="context">
        <div class="context_left">
          <div class="context_bgi_top">
            <div class="context_bgi">车号</div>
          </div>
          <div id="trainNo" class="text"></div>
        </div>
        <div class="context_right">
          <div class="context_bgi_top">
            <div class="context_bgi">重量</div>
          </div>
          <div id="weight" class="text"></div>
          <span class="danwei">t</span>
        </div>
      </div>
      <div class="context">
        <div class="context_left">
          <div class="context_bgi_top">
            <div class="context_bgi">主司机</div>
          </div>
          <div id="driver1" class="text"></div>
        </div>
        <div class="context_right">
          <div class="context_bgi_top">
            <div class="context_bgi">副司机</div>
          </div>
          <div id="driver2" class="text"></div>
        </div>
      </div>
      <div class="context">
        <div class="context_left">
          <div class="context_bgi_top">
            <div class="context_bgi">电话</div>
          </div>
          <div id="phone" class="text"></div>
        </div>
        <div class="context_right">
          <div class="context_bgi_top">
            <div class="context_bgi">速度</div>
          </div>
          <div id="speed" class="text"></div>
          <span class="danwei">km/h</span>
        </div>
      </div>
      <div class="floor">
        <div class="warning" onclick="warningBtn()">
          <!--      实时运行状态-->
        </div>
        <div class="error" onclick="errorBtn()"></div>
      </div>
    </div>
  </body>
  <script src="./lib/ac.min.js"></script>
  <script src="./lib/jquery-3.7.1.min.js"></script>
  <script>
    // 页面onMount事件
    $(document).ready(function () {
      // 重点2：由于Cloud端难以知晓客户端分辨率，故通过传入的客户端分辨率，更改1rem的默认大小
      let screenWidth = getURLParameter("screenWidth");
      if (screenWidth <= 1920) {
        screenWidth = 1920;
        $("html").css("font-size", "10px");
      } else {
        screenWidth = 3840;
        $("html").css("font-size", "20px");
      }

      // 后台取值
      let url = "http://10.12.48.182:8082/gate/SHSZLS/api/train/get/detail";
      let query = {
        trainType: trainType,
        trainNo: trainNo,
      };
      $.get(url, query, function (data) {
        console.log(data);
        document.getElementById("driver1").innerText = data.driver1;
        document.getElementById("driver2").innerText = data.driver2;
        document.getElementById("faultNum").innerText = data.faultNum;
        document.getElementById("phone").innerText = data.phone;
        document.getElementById("warnNum").innerText = data.warnNum;
        document.getElementById("trainNo").innerText = trainNo;
        document.getElementById("weight").innerHTML = weight;
        document.getElementById("speed").innerText = speed;
      });
    });
    function closeDialog() {
      let data = {
        context: "弹窗关闭",
        name: "close",
      };
      ue.internal.postevent(JSON.stringify(data));
    }
    let trainNo = getURLParameter("trainNo");
    let weight = getURLParameter("weight");
    let trainType = getURLParameter("trainType");
    let speed = getURLParameter("speed");
    let data = {
      trainNo: trainNo,
      trainType: trainType,
      type: "dialog",
      name: "train_dialog",
    };
    function warningBtn() {
      console.log(data);
      data.dialogState = "实时运维";
      data.btnContext = "实时运行状态";
      ue.internal.postevent(JSON.stringify(data));
    }
    function errorBtn() {
      console.log(data);
      data.dialogState = "故障诊断";
      data.btnContext = "故障诊断";
      ue.internal.postevent(JSON.stringify(data));
    }

    function getURLParameter(name) {
      return (
        decodeURIComponent(
          (new RegExp("[?|&]" + name + "=" + "([^&;]+?)(&|#|;|$)").exec(
            location.search
          ) || [, ""])[1].replace(/\+/g, "%20")
        ) || null
      );
    }
  </script>
</html>
