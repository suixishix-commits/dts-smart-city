<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>智慧城市数字孪生平台</title>
    <script>
      // 根字号适配：1920×1080 设计稿下 1rem = 10px（与 postcss-pxtorem rootValue 一致）。
      // 先按宽度算：4K(≥3840) 固定 2 倍、2K(≥2560) 固定 1.25 倍、≤768 下限 0.75 倍，其余等比；
      // 再受高度约束：窗口比 16:9 更扁时（如带地址栏的浏览器窗口）按高度等比缩小，保证一屏放得下。
      ;(function (d, w) {
        const f = () => {
          const c = d.documentElement.clientWidth,
            h = d.documentElement.clientHeight,
            byWidth = c >= 3840 ? 20 : c >= 2560 ? 12.5 : c <= 768 ? 7.5 : 10 * (c / 1920),
            byHeight = 10 * (h / 1080)
          d.documentElement.style.fontSize = Math.max(5, Math.min(byWidth, byHeight)) + 'px'
        }
        f()
        w.addEventListener('resize', f)
      })(document, window)
    </script>
    <!--      监控视频js文件-->
  </head>
  <body>
    <div id="app"></div>
    <!--全局变量配置-->
    <script src="/config/global.js"></script>
    <!--环境变量配置-->
    <script src="%VITE_VARIABLE_FILE%"></script>
    <script src="/config/smart-city.js"></script>
    <!--DTS ac_min.js配置-->
    <script src="http://%VITE_DTS_SERVER_URL%/libac"></script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
